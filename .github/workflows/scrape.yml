name: Scrape Chrono24 Nautilus listings

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "nautilus-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --quiet --cached || git commit -m "Update Nautilus listings [skip ci]"
          git push
