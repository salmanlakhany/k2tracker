<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nautilus Watch — Chrono24 Tracker</title>
<style>
  :root{
    --navy-deep:   #0c1620;
    --navy:        #10202f;
    --navy-card:   #142838;
    --steel:       #c7d0d8;
    --steel-dim:   #7f8e9a;
    --brass:       #c9a15a;
    --brass-bright:#e6c07a;
    --line:        #253a4a;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--navy-deep);
    color:var(--steel);
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;
    min-height:100vh;
  }

  /* ---------- header: a minute-track ring standing in for a page title ---------- */
  header{
    position:relative;
    padding:56px 24px 40px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(ellipse 900px 300px at 50% -80px, rgba(201,161,90,0.10), transparent 70%),
      var(--navy);
    overflow:hidden;
  }

  .dial{
    width:88px; height:88px;
    margin:0 auto 20px;
    border-radius:50%;
    border:2px solid var(--brass);
    position:relative;
    background:
      repeating-conic-gradient(var(--brass) 0deg 3deg, transparent 3deg 30deg);
    box-shadow: 0 0 0 6px rgba(201,161,90,0.08), 0 0 24px rgba(201,161,90,0.15);
  }
  .dial::after{
    content:"";
    position:absolute; inset:14px;
    border-radius:50%;
    background:var(--navy);
    border:1px solid var(--line);
  }
  .dial .hand{
    position:absolute;
    left:50%; bottom:50%;
    width:2px; height:26px;
    background:var(--brass-bright);
    transform-origin:bottom center;
    transform: translateX(-50%) rotate(38deg);
    border-radius:2px;
  }
  .dial .hand.min{
    height:32px; width:1.5px;
    transform: translateX(-50%) rotate(142deg);
    background:var(--steel);
  }

  h1{
    font-family:"Georgia","Times New Roman",serif;
    font-weight:600;
    font-size:clamp(28px,4vw,42px);
    letter-spacing:0.5px;
    margin:0 0 8px;
    color:#f2ede2;
  }
  h1 .ref{ color:var(--brass); font-style:italic; }

  .sub{
    color:var(--steel-dim);
    font-size:14px;
    letter-spacing:0.3px;
  }

  #status{
    margin-top:18px;
    display:inline-flex;
    gap:18px;
    font-size:13px;
    color:var(--steel-dim);
    font-family:"SF Mono","Menlo",monospace;
  }
  #status b{ color:var(--brass-bright); font-weight:600; }

  /* ---------- listings ---------- */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:36px 20px 80px;
  }

  #empty, #error{
    text-align:center;
    color:var(--steel-dim);
    padding:80px 20px;
    font-size:15px;
    line-height:1.7;
  }
  #error{ color:#d98a6a; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:16px;
  }

  .card{
    background:var(--navy-card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px 20px 18px;
    transition:border-color .15s ease, transform .15s ease;
    display:flex;
    flex-direction:column;
    gap:10px;
    text-decoration:none;
    color:inherit;
  }
  .card:hover{
    border-color:var(--brass);
    transform:translateY(-2px);
  }
  .card:focus-visible{
    outline:2px solid var(--brass-bright);
    outline-offset:2px;
  }

  .card .id{
    font-family:"SF Mono","Menlo",monospace;
    font-size:11px;
    letter-spacing:0.5px;
    color:var(--steel-dim);
    text-transform:uppercase;
  }

  .card .title{
    font-size:15px;
    line-height:1.45;
    color:#f2ede2;
    font-weight:500;
  }

  .card .price{
    margin-top:auto;
    font-family:"Georgia",serif;
    font-size:20px;
    color:var(--brass-bright);
    font-weight:600;
  }
  .card .price.unknown{
    font-size:14px;
    font-family:"Inter",sans-serif;
    color:var(--steel-dim);
    font-weight:400;
    font-style:italic;
  }

  footer{
    text-align:center;
    padding:30px 20px 50px;
    color:var(--steel-dim);
    font-size:12px;
  }
  footer a{ color:var(--brass); }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <div class="dial" aria-hidden="true">
    <div class="hand"></div>
    <div class="hand min"></div>
  </div>
  <h1>Nautilus <span class="ref">Watch</span></h1>
  <div class="sub">Every Patek Philippe Nautilus reference currently listed on Chrono24</div>
  <div id="status">
    <span>Checked <b id="checked-at">—</b></span>
    <span><b id="count">0</b> listings</span>
  </div>
</header>

<main>
  <div id="error" hidden></div>
  <div id="empty" hidden>No listings loaded yet — the first hourly check hasn't run. Come back shortly.</div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Data refreshes hourly · Sourced from <a href="https://www.chrono24.com/patekphilippe/nautilus--mod106.htm" target="_blank" rel="noopener">chrono24.com</a>
</footer>

<script>
  function timeAgo(iso){
    if(!iso) return "—";
    const then = new Date(iso).getTime();
    const mins = Math.round((Date.now() - then) / 60000);
    if(mins < 1) return "just now";
    if(mins < 60) return mins + "m ago";
    const hrs = Math.round(mins/60);
    if(hrs < 24) return hrs + "h ago";
    return Math.round(hrs/24) + "d ago";
  }

  async function load(){
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const error = document.getElementById('error');
    try{
      const res = await fetch('data.json', {cache:'no-store'});
      if(!res.ok) throw new Error('data.json not found yet');
      const data = await res.json();

      document.getElementById('checked-at').textContent = timeAgo(data.checked_at);
      document.getElementById('count').textContent = data.count ?? (data.listings || []).length;

      const listings = data.listings || [];
      if(listings.length === 0){
        empty.hidden = false;
        grid.innerHTML = '';
        return;
      }
      empty.hidden = true;

      grid.innerHTML = listings.map(item => `
        <a class="card" href="${item.url}" target="_blank" rel="noopener">
          <span class="id">Ref. ${item.id}</span>
          <span class="title">${item.title ?? 'Nautilus listing'}</span>
          <span class="price ${item.price ? '' : 'unknown'}">${item.price ?? 'Price on request'}</span>
        </a>
      `).join('');
    }catch(e){
      error.hidden = false;
      error.textContent = "Couldn't load listings (" + e.message + "). If this is the first run, the hourly check may not have completed yet.";
    }
  }

  load();
  setInterval(load, 5 * 60 * 1000); // refresh the view every 5 min; data itself updates hourly
</script>

</body>
</html>
